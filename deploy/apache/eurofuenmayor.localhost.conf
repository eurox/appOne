<VirtualHost *:80>
    ServerName eurofuenmayor.localhost
    DocumentRoot /home/efuenmayor/eurofuenmayor-portfolio/public

    <Directory /home/efuenmayor/eurofuenmayor-portfolio/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/eurofuenmayor-php83.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/eurofuenmayor-error.log
    CustomLog ${APACHE_LOG_DIR}/eurofuenmayor-access.log combined
</VirtualHost>
